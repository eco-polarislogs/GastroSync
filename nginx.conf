# GastroSync — Web arayüzü + API / WebSocket ters proxy
# TLS (HTTPS) sonlandırması önüne konan yük dengeleyici / reverse proxy (örn. Caddy, Traefik,
# certbot'lu Nginx) tarafından yapılmalıdır. Canlıda yalnızca HTTPS üzerinden yayın yapın.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTPS önde (Render, Caddy) sonlandırılır: öndeki proxy'nin bildirdiği şemayı arka uca aynen ilet
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Güvenlik başlıkları (alt location'larda add_header kullanılmadığı için miras alınır)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass http://${BACKEND_HOSTPORT};
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # STOMP / WebSocket
    location /ws {
        proxy_pass http://${BACKEND_HOSTPORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /actuator/health {
        proxy_pass http://${BACKEND_HOSTPORT};
    }

    # Derlenmiş varlıklar içerik özetli adlara sahiptir: uzun süre önbelleklenebilir
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: index.html her zaman taze alınır (yeni sürüm anında yansır)
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
