# Izole test profili: gercek PostgreSQL verisine ASLA dokunmaz.
spring.datasource.url=jdbc:h2:mem:gastrosync_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
gastrosync.jwt.secret=dGVzdC1vbmx5LWdhc3Ryb3N5bmMtand0LXNpZ25pbmcta2V5LTIwMjYtMzItYnl0ZXM=
gastrosync.seed.demo-data=true
gastrosync.security.max-login-attempts=5
logging.level.com.gastrosync=WARN

# Oturum modeli: kisa omurlu erisim token (15 dk) + yenileme token
gastrosync.jwt.expiration-ms=900000
