# Turkish Locale Messages
error.unauthorized=Kimlik doğrulama başarısız veya oturum süresi doldu.
error.forbidden=Bu işlem için yetkiniz bulunmamaktadır (Yetki Yetersiz).
error.not_found=Aranan kaynak sistemde bulunamadı.
error.validation=Gönderilen verilerde doğrulama hatası tespit edildi.
error.conflict=Veritabanı kısıt ihlali veya mükerrer kayıt oluştu.
error.internal=Sistemsel bir sunucu hatası meydana geldi.
error.bad_request=Geçersiz istek parametresi veya sözdizimi hatası.

# Auth & User
auth.login.success=Giriş başarılı. Oturum açıldı.
auth.login.failed=Kullanıcı adı veya şifre hatalı.
user.created=Kullanıcı başarıyla oluşturuldu.
user.role_updated=Kullanıcı rolü başarıyla güncellendi.
user.deleted=Kullanıcı hesabı güvenle silindi.

# Expense & Inventory
expense.created=Gider kaydı veritabanına başarıyla kaydedildi.
expense.updated=Gider kaydı güncellendi.
expense.deleted=Gider kaydı arşivlendi (Soft Delete).
inventory.received=Stok girişi veritabanına başarıyla işlendi.
inventory.waste=Zayiat kaydı başarıyla oluşturuldu.

# Chat
chat.sent=Mesaj başarıyla iletildi.
