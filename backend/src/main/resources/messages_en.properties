# English Locale Messages
error.unauthorized=Authentication failed or session has expired.
error.forbidden=Access denied. You do not have permission to execute this operation.
error.not_found=The requested resource could not be found.
error.validation=Validation error detected in request payload.
error.conflict=Database constraint violation or duplicate record.
error.internal=An internal server error occurred.
error.bad_request=Invalid request parameters or syntax error.

# Auth & User
auth.login.success=Authentication successful. Logged in.
auth.login.failed=Invalid username or password.
user.created=User created successfully.
user.role_updated=User role updated successfully.
user.deleted=User account safely deleted.

# Expense & Inventory
expense.created=Expense record successfully saved to database.
expense.updated=Expense record updated.
expense.deleted=Expense record archived (Soft Delete).
inventory.received=Stock receipt successfully committed to database.
inventory.waste=Waste record created successfully.

# Chat
chat.sent=Message sent successfully.
