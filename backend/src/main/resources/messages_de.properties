# German Locale Messages
error.unauthorized=Authentifizierung fehlgeschlagen oder Sitzung ist abgelaufen.
error.forbidden=Zugriff verweigert. Unzureichende Berechtigungen für diese Operation.
error.not_found=Die angeforderte Ressource wurde nicht gefunden.
error.validation=Validierungsfehler in den übermittelten Daten festgestellt.
error.conflict=Datenbank-Constraint-Verletzung oder doppelter Eintrag.
error.internal=Ein interner Serverfehler ist aufgetreten.
error.bad_request=Ungültige Anfrageparameter oder Syntaxfehler.

# Auth & User
auth.login.success=Anmeldung erfolgreich. Sitzung eröffnet.
auth.login.failed=Ungültiger Benutzername oder Passwort.
user.created=Benutzer erfolgreich erstellt.
user.role_updated=Benutzerrolle erfolgreich aktualisiert.
user.deleted=Benutzerkonto sicher gelöscht.

# Expense & Inventory
expense.created=Ausgabe erfolgreich in der Datenbank gespeichert.
expense.updated=Ausgabe aktualisiert.
expense.deleted=Ausgabe archiviert (Soft Delete).
inventory.received=Wareneingang erfolgreich in der Datenbank gebucht.
inventory.waste=Ausschussbuchung erfolgreich erstellt.

# Chat
chat.sent=Nachricht erfolgreich übermittelt.
