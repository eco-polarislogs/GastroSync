# Arabic Locale Messages
error.unauthorized=فشل التحقق من الهوية أو انتهت صلاحية الجلسة.
error.forbidden=تم رفض الوصول. ليس لديك الصلاحيات الكافية لتنفيذ هذه العملية.
error.not_found=المورد المطلوب غير موجود في النظام.
error.validation=تم اكتشاف خطأ في التحقق من صحة البيانات المدخلة.
error.conflict=تعارض في قيود قاعدة البيانات أو تكرار السجل.
error.internal=حدث خطأ غير متوقع في الخادم.
error.bad_request=معلمات الطلب غير صالحة أو خطأ في بناء الجملة.

# Auth & User
auth.login.success=تم تسجيل الدخول بنجاح.
auth.login.failed=اسم المستخدم أو كلمة المرور غير صحيحة.
user.created=تم إنشاء المستخدم بنجاح.
user.role_updated=تم تحديث دور المستخدم بنجاح.
user.deleted=تم حذف حساب المستخدم بأمان.

# Expense & Inventory
expense.created=تم حفظ المصروف بنجاح في قاعدة البيانات.
expense.updated=تم تحديث المصروف.
expense.deleted=تمت أرشفة المصروف بنجاح.
inventory.received=تم تسجيل استلام المخزون بنجاح في قاعدة البيانات.
inventory.waste=تم تسجيل الهدر بنجاح.

# Chat
chat.sent=تم إرسال الرسالة بنجاح.
