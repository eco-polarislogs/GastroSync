# ============================================================
# GastroSync - Uretim (Canli) Profili
# Calistirma: SPRING_PROFILES_ACTIVE=prod
# Zorunlu ortam degiskenleri:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   GASTROSYNC_JWT_SECRET (>= 32 bayt), CORS_ALLOWED_ORIGINS
#   GASTROSYNC_ADMIN_PASSWORD (yalnizca ilk kurulumda, bos veritabaninda)
# ============================================================
gastrosync.seed.demo-data=${GASTROSYNC_SEED_DEMO_DATA:false}
gastrosync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.root=INFO
logging.level.com.gastrosync=INFO
logging.level.org.hibernate.SQL=WARN
