server.port=${SERVER_PORT:${PORT:8080}}
spring.application.name=gastrosync-backend

# ============================================================
# Yerel gelistirme: kok dizindeki .env dosyasi (git'e girmez) otomatik okunur.
# Uretimde degerler isletim sistemi / container ortam degiskenlerinden gelir.
# ============================================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ============================================================
# PostgreSQL Baglantisi (sifre ASLA koda yazilmaz -> DB_PASSWORD)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gastrosync}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=GastroSyncHikariPool

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# JWT
#  - GASTROSYNC_JWT_SECRET: en az 32 bayt (Base64 veya duz metin)
#  - Uretim profilinde zorunludur; gelistirmede yoksa gecici anahtar uretilir.
# ============================================================
gastrosync.jwt.secret=${GASTROSYNC_JWT_SECRET:${JWT_SECRET:}}
#  - Erisim token'i kisa omurludur (OWASP: 5-15 dk); istemci bitmeden /api/auth/refresh ile yeniler
gastrosync.jwt.expiration-ms=${GASTROSYNC_JWT_EXPIRATION:${JWT_EXPIRATION:900000}}
gastrosync.jwt.issuer=GastroSync-ERP
#  - Yenileme token'i: her kullanimda dondurulur; kullanilmazsa bu kadar gun sonra gecersiz olur
gastrosync.jwt.refresh-expiration-days=${GASTROSYNC_REFRESH_EXPIRATION_DAYS:7}
#  - Mutlak oturum suresi: bu kadar gunde bir yeniden giris zorunludur
gastrosync.jwt.session-max-days=${GASTROSYNC_SESSION_MAX_DAYS:30}

# ============================================================
# CORS / WebSocket izinli kaynaklar (virgulle ayrilmis, desen destekler)
# ============================================================
gastrosync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.*.*.*:[*]}

# ============================================================
# Is kurallari
# ============================================================
# Gorevler ayriligi: gideri kaydeden kisi ayni gideri onaylayamaz (maker-checker)
gastrosync.accounting.enforce-segregation=${GASTROSYNC_ENFORCE_SEGREGATION:true}
# Restoran yeme-icme hizmetleri varsayilan KDV orani (%)
gastrosync.tax.default-sales-vat-rate=${GASTROSYNC_SALES_VAT_RATE:10}
# Giderler icin varsayilan KDV orani (%)
gastrosync.tax.default-expense-vat-rate=${GASTROSYNC_EXPENSE_VAT_RATE:20}
gastrosync.analytics.target-food-cost-percent=30.0
# Sayim farki Mudur onayi esigi: fark %X ve Y TL'yi birlikte ya da tek basina Z TL'yi asarsa onaya gider
gastrosync.inventory.count-approval-percent=${GASTROSYNC_COUNT_APPROVAL_PERCENT:5}
gastrosync.inventory.count-approval-min-amount=${GASTROSYNC_COUNT_APPROVAL_MIN_AMOUNT:250}
gastrosync.inventory.count-approval-amount=${GASTROSYNC_COUNT_APPROVAL_AMOUNT:1000}

# Telefon (push) bildirimleri: Expo Push Service -> FCM / APNs
gastrosync.push.enabled=${GASTROSYNC_PUSH_ENABLED:true}
gastrosync.push.expo-access-token=${GASTROSYNC_EXPO_ACCESS_TOKEN:}
gastrosync.push.android-channel=gastrosync

# Brute-force korumasi
gastrosync.security.max-login-attempts=5
gastrosync.security.lockout-minutes=5

# Demo veri yukleme (uretimde false)
gastrosync.seed.demo-data=${GASTROSYNC_SEED_DEMO_DATA:true}
# Ilk kurulumda (hic kullanici yokken) olusturulacak yonetici sifresi
gastrosync.seed.admin-password=${GASTROSYNC_ADMIN_PASSWORD:}

# ============================================================
# Actuator (sadece saglik kontrolu disariya acik)
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ============================================================
# Swagger / OpenAPI (uretimde kapali)
# ============================================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ============================================================
# Hata yanitlari ic ayrinti sizdirmaz
# ============================================================
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.forward-headers-strategy=framework

# ── İşletme kimliği (fiş başlığı ve e-Arşiv satıcı bilgisi) ─────────────
gastrosync.restaurant.name=${GASTROSYNC_RESTAURANT_NAME:GastroSync Restoran}
gastrosync.restaurant.receipt-footer=${GASTROSYNC_RECEIPT_FOOTER:Afiyet olsun!}
gastrosync.company.title=${GASTROSYNC_COMPANY_TITLE:GastroSync Demo Restoran}
gastrosync.company.vkn=${GASTROSYNC_COMPANY_VKN:1234567890}
gastrosync.company.tax-office=${GASTROSYNC_COMPANY_TAX_OFFICE:Demo Vergi Dairesi}
gastrosync.company.address=${GASTROSYNC_COMPANY_ADDRESS:Demo Mah. Ornek Cad. No:1}
gastrosync.company.city=${GASTROSYNC_COMPANY_CITY:Istanbul}
# ── Mali belge: NONE = e-Arşiv UBL-TR XML üretilir, taslak saklanır (entegratör paneline yüklenir)
#    TEST = belgeler kabul edilmiş sayılır (GİB'e gönderilmez). Canlı entegratör bağlantısı sözleşmeyle eklenir.
gastrosync.fiscal.provider=${GASTROSYNC_FISCAL_PROVIDER:NONE}
gastrosync.fiscal.earsiv-prefix=${GASTROSYNC_EARSIV_PREFIX:GSA}
