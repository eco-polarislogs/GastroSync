server.port=8080

# ============================================================
# PostgreSQL Connection
# ============================================================
# WHY ${DB_PASSWORD:defaultLocalPassword}?
# The ${} syntax reads from environment variables at runtime.
# The colon (:) provides a FALLBACK for local development only.
# In production, DB_PASSWORD MUST be set as an OS-level environment variable.
# This prevents credentials from being committed to Git — a critical security rule.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gastrosync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:EcReN12854700456.}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
# WHY ddl-auto=update (for now)?
# In development, 'update' auto-applies schema changes. In Phase 3 (Database),
# we will replace this with Flyway migrations and set ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# Enterprise Connection Pool (HikariCP)
# ============================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=GastroSyncHikariPool

# ============================================================
# JWT Security Configuration
# ============================================================
# WHY externalize the JWT secret?
# The JWT signing key is the MOST sensitive value in the entire system.
# If an attacker obtains this key, they can forge valid tokens for ANY user/role.
# It MUST be loaded from environment variables, never hardcoded.
#
# WHY 256-bit minimum?
# HMAC-SHA256 (HS256) requires a key of at least 256 bits (32 bytes) per RFC 7518.
# Our default key is 64 chars (Base64-encoded) = 384 bits, exceeding the minimum.
#
# WHY 24h expiration?
# Short-lived tokens reduce the attack window if a token is stolen.
# A restaurant shift is typically 8-12 hours; 24h provides comfortable margin
# without keeping tokens valid indefinitely.
gastrosync.jwt.secret=${JWT_SECRET:Z2FzdHJvc3luYy1lcnAtc3VwZXItc2VjdXJlLWp3dC1zaWduaW5nLWtleS0yMDI2LXByb2R1Y3Rpb24ta2V5}
gastrosync.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
gastrosync.jwt.issuer=GastroSync-ERP

# ============================================================
# Encoding
# ============================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
