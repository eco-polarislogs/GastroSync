version: '3.8'

services:
  # ── 1. DATABASE: PostgreSQL 16 ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gastrosync-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastrosync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EcReN12854700456.}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gastrosync}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gastrosync-net

  # ── 2. BACKEND: Spring Boot 3.x (Java 21) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastrosync-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gastrosync}?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-EcReN12854700456.}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GASTROSYNC_JWT_SECRET: ${GASTROSYNC_JWT_SECRET:-GastroSyncEnterpriseSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026Secure}
      GASTROSYNC_JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - gastrosync-net

  # ── 3. FRONTEND: React Web Dashboard (Nginx Alpine) ───────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastrosync-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - gastrosync-net

volumes:
  pgdata:
    driver: local

networks:
  gastrosync-net:
    driver: bridge
